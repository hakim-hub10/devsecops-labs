name: DevSecOps - Trivy Security Scan

permissions:
  contents: read
  security-events: write

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  trivy-scan:
    name: Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload FS Scan Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif


  docker-image-scan:
  name: Dockerfile Config Scan
  runs-on: ubuntu-latest
  needs: trivy-scan

  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Run Trivy Dockerfile Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: config
        scan-ref: ./wazuh-docker-4.7.5/build-docker-images
        format: sarif
        output: docker-config-results.sarif
        severity: HIGH,CRITICAL

    - name: Upload Docker Scan Results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: docker-config-results.sarif
